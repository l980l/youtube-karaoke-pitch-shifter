<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="50%" stop-color="#9B51E0"/>
      <stop offset="100%" stop-color="#05D9E8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Inner dark card -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="#12131C" fill-opacity="0.92"/>
  
  <!-- Microphone body -->
  <g filter="url(#glow)">
    <!-- Mic Head -->
    <rect x="52" y="24" width="24" height="42" rx="12" fill="#FFFFFF"/>
    
    <!-- Mic Grille lines -->
    <line x1="52" y1="36" x2="76" y2="36" stroke="#9B51E0" stroke-width="2"/>
    <line x1="52" y1="46" x2="76" y2="46" stroke="#9B51E0" stroke-width="2"/>
    <line x1="64" y1="24" x2="64" y2="66" stroke="#9B51E0" stroke-width="2"/>

    <!-- Mic U-Holder -->
    <path d="M42 46 C42 70, 86 70, 86 46" fill="none" stroke="#05D9E8" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Stand -->
    <line x1="64" y1="68" x2="64" y2="86" stroke="#05D9E8" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 86 L80 86" stroke="#05D9E8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Pitch +/- Badges -->
  <!-- Flat (b) / Down Badge -->
  <g transform="translate(18, 70)">
    <circle cx="14" cy="14" r="14" fill="#FF2A6D"/>
    <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">♭</text>
  </g>

  <!-- Sharp (#) / Up Badge -->
  <g transform="translate(82, 70)">
    <circle cx="14" cy="14" r="14" fill="#05D9E8"/>
    <text x="14" y="20" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#12131C" text-anchor="middle">♯</text>
  </g>
</svg>
